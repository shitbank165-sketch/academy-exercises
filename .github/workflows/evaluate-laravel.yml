name: Evaluate Laravel Submission

on:
  workflow_dispatch:
    inputs:
      submission_id:
        description: 'Submission ID from Laravel platform'
        required: true
        type: string
      exercise_slug:
        description: 'Exercise slug'
        required: true
        type: string
      test_suite:
        description: 'Hidden test suite key'
        required: true
        type: string
      student_branch:
        description: 'Student branch name'
        required: true
        type: string
      attempt_token:
        description: 'GitHub dispatch token from platform'
        required: true
        type: string
      student_repository:
        description: 'Student repository URL'
        required: true
        type: string

permissions:
  contents: read

env:
  ACADEMY_URL: ${{ secrets.ACADEMY_URL }}
  CALLBACK_SECRET: ${{ secrets.GITHUB_EXERCISE_CALLBACK_SECRET }}

jobs:
  evaluate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout runner repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Parse student repository
        id: parse_repo
        shell: bash
        run: |
          if [[ "${{ github.event.inputs.student_repository }}" =~ ^https://github\.com/([^/]+)/([^/]+)(\.git)?$ ]]; then
            echo "owner=${BASH_REMATCH[1]}" >> $GITHUB_OUTPUT
            echo "repository=${BASH_REMATCH[2]}" >> $GITHUB_OUTPUT
          else
            echo "Invalid GitHub repository URL: ${{ github.event.inputs.student_repository }}"
            exit 1
          fi

      - name: Checkout student submission
        uses: actions/checkout@v4
        with:
          repository: ${{ steps.parse_repo.outputs.owner }}/${{ steps.parse_repo.outputs.repository }}
          ref: ${{ github.event.inputs.student_branch }}
          path: student-submission

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, dom, fileinfo, pdo_sqlite, sqlite3
          coverage: none

      - name: Copy student files to runner
        run: |
          cp -r student-submission/app/* app/ 2>/dev/null || true
          cp -r student-submission/database/* database/ 2>/dev/null || true
          cp -r student-submission/routes/* routes/ 2>/dev/null || true
          cp -r student-submission/tests/* tests/ 2>/dev/null || true

      - name: Install dependencies
        run: |
          composer install --no-interaction --no-progress --prefer-dist

      - name: Create .env file
        run: |
          cp .env.example .env 2>/dev/null || true
          php artisan key:generate --force

      - name: Run tests
        id: tests
        run: |
          php artisan test --testdox --json=test-results.json > test-output.txt 2>&1 || true

      - name: Process test results
        id: results
        run: |
          php <<'EOF'
          <?php
          $jsonFile = 'test-results.json';
          $textFile = 'test-output.txt';
          $passed = 0;
          $failed = 0;
          $checks = [];
          if (file_exists($jsonFile)) {
              $results = json_decode(file_get_contents($jsonFile), true);
              foreach ($results['tests'] ?? [] as $test) {
                  if (($test['status'] ?? null) === 'passed') {
                      $passed++;
                  } else {
                      $failed++;
                      $checks[] = [
                          'language' => 'php',
                          'passed' => false,
                          'message' => $test['name'] ?? 'Test failed',
                      ];
                  }
              }
          }
          $output = file_exists($textFile) ? file_get_contents($textFile) : '';
          if (preg_match('/(\\d+) passed/', $output, $m)) {
              $passed = (int) $m[1];
          }
          if (preg_match('/(\\d+) failed/', $output, $m)) {
              $failed = (int) $m[1];
          }
          $total = max(1, $passed + $failed);
          $score = (int) (($passed / $total) * 100);
          $testsPassed = $failed === 0 && $passed > 0;
          if (empty($checks)) {
              $checks[] = [
                  'language' => 'php',
                  'passed' => $testsPassed,
                  'message' => $testsPassed
                      ? "All $passed tests passed"
                      : ($failed > 0 ? "$failed tests failed" : "No tests found"),
              ];
          }
          file_put_contents('evaluation-results.json', json_encode([
              'score' => $score,
              'passed' => $testsPassed,
              'checks' => $checks,
          ], JSON_PRETTY_PRINT));
          EOF
          echo "evaluation_results=1" >> $GITHUB_OUTPUT

      - name: Upload result artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evaluation-result-${{ github.event.inputs.submission_id }}
          path: |
            test-output.txt
            test-results.json
            evaluation-results.json

      - name: Send evaluation callback
        if: always()
        shell: bash
        run: |
          set -e
          results=$(cat evaluation-results.json)
          score=$(jq '.score' evaluation-results.json)
          passed=$(jq '.passed' evaluation-results.json)
          payload=$(jq -n --arg token "${{ github.event.inputs.attempt_token }}" \
                           --argjson score "$score" \
                           --argjson passed "$passed" \
                           --argjson checks "$(jq '.checks' evaluation-results.json)" \
                           '{
                              attempt_token: $token,
                              status: "completed",
                              score: $score,
                              passed: $passed,
                              feedback: {
                                earned_points: $score,
                                total_points: 100,
                                checks: $checks
                              }
                            }')
          signature="sha256=$(printf '%s' "$payload" | openssl dgst -sha256 -hmac "${CALLBACK_SECRET}" | sed 's/^.*= //')"
          response=$(curl -sS -w "%{http_code}" -o /tmp/callback-response.txt \
            -X POST "${ACADEMY_URL}/api/exercises/github-callback" \
            -H "Content-Type: application/json" \
            -H "X-Academy-Signature: ${signature}" \
            --data "$payload")
          echo "callback_status=$response" >> $GITHUB_OUTPUT
          echo "callback_body=$(cat /tmp/callback-response.txt)" >> $GITHUB_OUTPUT
          if [ "$response" -lt 200 ] || [ "$response" -ge 300 ]; then
            echo "Callback failed: $(cat /tmp/callback-response.txt)"
            exit 1
          fi

      - name: Fail workflow if evaluation failed
        if: always() && steps.results.outputs.evaluation_results == '1' && (jq '.passed' evaluation-results.json) != true
        run: |
          echo "Evaluation failed: marking workflow failure for GitHub visibility"
          exit 1
