name: Evaluate Laravel Submission

on:
  workflow_dispatch:
    inputs:
      submission_id:
        description: 'Submission ID from Laravel platform'
        required: true
        type: string
      exercise_slug:
        description: 'Exercise slug'
        required: true
        type: string
      test_suite:
        description: 'Hidden test suite key'
        required: true
        type: string
      student_branch:
        description: 'Student branch name'
        required: true
        type: string
      attempt_token:
        description: 'GitHub dispatch token from platform'
        required: true
        type: string
      student_repository:
        description: 'Student repository URL'
        required: true
        type: string

permissions:
  contents: read

env:
  ACADEMY_URL: ${{ secrets.ACADEMY_URL }}
  CALLBACK_SECRET: ${{ secrets.GITHUB_EXERCISE_CALLBACK_SECRET }}

jobs:
  evaluate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout runner repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Checkout student submission
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event.inputs.student_repository }}
          ref: ${{ github.event.inputs.student_branch }}
          path: student-submission

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, dom, fileinfo, pdo_sqlite, sqlite3
          coverage: none

      - name: Copy student files to runner
        run: |
          cp -r student-submission/app/* app/ 2>/dev/null || true
          cp -r student-submission/database/* database/ 2>/dev/null || true
          cp -r student-submission/routes/* routes/ 2>/dev/null || true
          cp -r student-submission/tests/* tests/ 2>/dev/null || true

      - name: Install dependencies
        run: |
          composer install --no-interaction --no-progress --prefer-dist

      - name: Create .env file
        run: |
          cp .env.example .env 2>/dev/null || true
          php artisan key:generate

      - name: Run tests
        id: tests
        run: |
          php artisan test --testdox --json=test-results.json > test-output.txt 2>&1 || true

      - name: Process test results
        id: results
        run: |
          php <<'EOF'
          <?php
          $jsonFile = 'test-results.json';
          $textFile = 'test-output.txt';
          $passed = 0;
          $failed = 0;
          $checks = [];
          if (file_exists($jsonFile)) {
              $results = json_decode(file_get_contents($jsonFile), true);
              if (isset($results['tests'])) {
                  foreach ($results['tests'] as $test) {
                      if ($test['status'] === 'passed') {
                          $passed++;
                      } else {
                          $failed++;
                          $checks[] = [
                              'language' => 'php',
                              'passed' => false,
                              'message' => $test['name'] ?? 'Test failed',
                          ];
                      }
                  }
              }
          }
          if (file_exists($textFile)) {
              $output = file_get_contents($textFile);
              if (preg_match('/(\d+) passed/', $output, $matches)) {
                  $passed = (int) $matches[1];
              }
              if (preg_match('/(\d+) failed/', $output, $matches)) {
                  $failed = (int) $matches[1];
              }
          }
          $total = $passed + $failed;
          $score = $total > 0 ? (int) (($passed / $total) * 100) : 0;
          $testsPassed = $failed === 0 && $passed > 0;
          if (empty($checks)) {
              $checks[] = [
                  'language' => 'php',
                  'passed' => $testsPassed,
                  'message' => $testsPassed
                      ? "All $passed tests passed"
                      : ($failed > 0 ? "$failed tests failed" : "No tests found"),
              ];
          }
          $results = [
              'score' => $score,
              'passed' => $testsPassed,
              'test_count' => $total,
              'tests_passed' => $passed,
              'tests_failed' => $failed,
              'checks' => $checks,
          ];
          file_put_contents('evaluation-results.json', json_encode($results, JSON_PRETTY_PRINT));
          echo "results=" . json_encode($results) . PHP_EOL;
          EOF
          RESULTS=$(cat evaluation-results.json)
          echo "results=${RESULTS}" >> $GITHUB_OUTPUT

      - name: Upload result artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evaluation-result-${{ github.event.inputs.submission_id }}
          path: |
            test-output.txt
            test-results.json
            evaluation-results.json

      - name: Send evaluation callback
        if: always()
        run: |
          php <<'EOF'
          <?php
          $resultsFile = 'evaluation-results.json';
          if (!file_exists($resultsFile)) {
              echo "::error::Evaluation results file not found\n";
              exit(1);
          }
          $results = json_decode(file_get_contents($resultsFile), true);
          $payload = [
              'attempt_token' => '${{ github.event.inputs.attempt_token }}',
              'status' => $results['passed'] ? 'completed' : 'completed',
              'score' => $results['score'],
              'passed' => $results['passed'],
              'feedback' => [
                  'earned_points' => $results['score'],
                  'total_points' => 100,
                  'checks' => $results['checks'],
              ],
          ];
          $rawBody = json_encode($payload);
          $secret = '${{ env.CALLBACK_SECRET }}';
          $signature = 'sha256=' . hash_hmac('sha256', $rawBody, $secret);
          $ch = curl_init();
          curl_setopt_array($ch, [
              CURLOPT_URL => '${{ env.ACADEMY_URL }}/api/exercises/github-callback',
              CURLOPT_RETURNTRANSFER => true,
              CURLOPT_CUSTOMREQUEST => 'POST',
              CURLOPT_HTTPHEADER => [
                  'Content-Type: application/json',
                  'X-Academy-Signature: ' . $signature,
              ],
              CURLOPT_POSTFIELDS => $rawBody,
          ]);
          $response = curl_exec($ch);
          $httpCode = curl_getinfo($ch, CURLINFO_HTTP_CODE);
          curl_close($ch);
          echo "HTTP Status: $httpCode\n";
          echo "Response: $response\n";
          if ($httpCode < 200 || $httpCode >= 300) {
              exit(1);
          }
          EOF

      - name: Fail workflow if evaluation failed
        if: steps.results.outputs.results != ''
        run: |
          exit 1
