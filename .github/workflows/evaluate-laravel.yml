name: Evaluate Laravel Submission

on:
  workflow_dispatch:
    inputs:
      submission_id:
        description: 'Submission ID from Laravel platform'
        required: true
        type: string
      exercise_slug:
        description: 'Exercise slug'
        required: true
        type: string
      test_suite:
        description: 'Hidden test suite key'
        required: true
        type: string
      student_branch:
        description: 'Student branch name'
        required: true
        type: string
      attempt_token:
        description: 'GitHub dispatch token from platform'
        required: true
        type: string
      student_repository:
        description: 'Student repository URL'
        required: true
        type: string

permissions:
  contents: read

env:
  ACADEMY_URL: ${{ secrets.ACADEMY_URL }}
  CALLBACK_SECRET: ${{ secrets.GITHUB_EXERCISE_CALLBACK_SECRET }}
  STUDENT_REPOSITORY: ${{ github.event.inputs.student_repository }}
  STUDENT_BRANCH: ${{ github.event.inputs.student_branch }}
  ATTEMPT_TOKEN: ${{ github.event.inputs.attempt_token }}
  SUBMISSION_ID: ${{ github.event.inputs.submission_id }}
  TEST_SUITE: ${{ github.event.inputs.test_suite }}
  EXERCISE_SLUG: ${{ github.event.inputs.exercise_slug }}

jobs:
  evaluate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout runner repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Parse student repository
        id: parse_repo
        shell: bash
        run: |
          if [[ "${STUDENT_REPOSITORY}" =~ ^https://github\.com/([^/]+)/([^/]+)(\.git)?$ ]]; then
            echo "owner=${BASH_REMATCH[1]}" >> "$GITHUB_OUTPUT"
            echo "repo=${BASH_REMATCH[2]}" >> "$GITHUB_OUTPUT"
          else
            echo "Invalid GitHub repository URL: ${STUDENT_REPOSITORY}"
            exit 1
          fi

      - name: Checkout student submission
        uses: actions/checkout@v4
        with:
          repository: ${{ steps.parse_repo.outputs.owner }}/${{ steps.parse_repo.outputs.repo }}
          ref: ${{ env.STUDENT_BRANCH }}
          path: student-submission

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, dom, fileinfo, pdo_sqlite, sqlite3
          coverage: none

      - name: Copy student files to runner
        run: |
          cp -r student-submission/app/* app/ 2>/dev/null || true
          cp -r student-submission/database/* database/ 2>/dev/null || true
          cp -r student-submission/routes/* routes/ 2>/dev/null || true
          cp -r student-submission/tests/* tests/ 2>/dev/null || true

      - name: Install dependencies
        working-directory: student-submission
        run: |
          composer install --no-interaction --no-progress --prefer-dist

      - name: Create .env file
        working-directory: student-submission
        run: |
          cp .env.example .env 2>/dev/null || true
          php artisan key:generate --force

      - name: Run tests
        id: tests
        working-directory: student-submission
        run: |
          php artisan test --testdox --json=test-results.json > test-output.txt 2>&1 || true

      - name: Process test results
        id: results
        working-directory: student-submission
        shell: bash
        run: |
          php <<'EOF'
          <?php
          $jsonFile = 'test-results.json';
          $textFile = 'test-output.txt';
          $passed = 0;
          $failed = 0;
          $checks = [];

          if (file_exists($jsonFile)) {
              $results = json_decode(file_get_contents($jsonFile), true);
              foreach ($results['tests'] ?? [] as $test) {
                  if (($test['status'] ?? null) === 'passed') {
                      $passed++;
                  } else {
                      $failed++;
                      $checks[] = [
                          'language' => 'php',
                          'passed' => false,
                          'message' => $test['name'] ?? 'Test failed',
                      ];
                  }
              }
          }

          if (file_exists($textFile)) {
              $output = file_get_contents($textFile);
              if (preg_match('/(\d+) passed/', $output, $m)) {
                  $passed = (int) $m[1];
              }
              if (preg_match('/(\d+) failed/', $output, $m)) {
                  $failed = (int) $m[1];
              }
          }

          $total = max(1, $passed + $failed);
          $score = (int) (($passed / $total) * 100);
          $testsPassed = $failed === 0 && $passed > 0;

          $results = [
              'score' => $score,
              'passed' => $testsPassed,
              'checks' => $checks ?: [
                  [
                      'language' => 'php',
                      'passed' => $testsPassed,
                      'message' => $testsPassed
                          ? "All $passed tests passed"
                          : ($failed > 0 ? "$failed tests failed" : "No tests found"),
                  ],
              ],
          ];

          file_put_contents('evaluation-results.json', json_encode($results, JSON_PRETTY_PRINT));
          EOF

          echo "score=$(php -r 'echo json_decode(file_get_contents(\"evaluation-results.json\"), true)[\"score\"];')" >> "$GITHUB_OUTPUT"
          echo "passed=$(php -r 'echo json_decode(file_get_contents(\"evaluation-results.json\"), true)[\"passed\"] ? \"true\" : \"false\";')" >> "$GITHUB_OUTPUT"

      - name: Upload result artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evaluation-result-${{ github.event.inputs.submission_id }}
          path: |
            student-submission/test-output.txt
            student-submission/test-results.json
            student-submission/evaluation-results.json

      - name: Send evaluation callback
        if: always()
        working-directory: student-submission
        shell: bash
        run: |
          payload=$(cat <<'JSON'
          {
            "attempt_token": "${ATTEMPT_TOKEN}",
            "status": "completed",
            "score": $(php -r 'echo json_decode(file_get_contents("evaluation-results.json"), true)["score"];'),
            "passed": $(php -r 'echo json_encode(json_decode(file_get_contents("evaluation-results.json"), true)["passed"]);'),
            "feedback": {
              "earned_points": $(php -r 'echo json_decode(file_get_contents("evaluation-results.json"), true)["score"];'),
              "total_points": 100,
              "checks": $(php -r 'echo json_encode(json_decode(file_get_contents("evaluation-results.json"), true)["checks"]);')
            }
          }
          JSON
          )

          signature="sha256=$(printf '%s' "$payload" | openssl dgst -sha256 -hmac "${CALLBACK_SECRET}" | sed 's/^.*= //')"
          response=$(curl -sS -w "%{http_code}" -o /tmp/callback-response.txt \
            -X POST "${ACADEMY_URL}/api/exercises/github-callback" \
            -H "Content-Type: application/json" \
            -H "X-Academy-Signature: $signature" \
            --data "$payload")

          echo "callback_status=$response"
          echo "callback_body=$(cat /tmp/callback-response.txt)"

          if [ "$response" -lt 200 ] || [ "$response" -ge 300 ]; then
            echo "Callback failed: $(cat /tmp/callback-response.txt)"
            exit 1
          fi

      - name: Fail workflow if evaluation failed
        if: always() && steps.results.outputs.passed != 'true'
        run: |
          echo "Evaluation failed; failing workflow for GitHub visibility"
          exit 1
